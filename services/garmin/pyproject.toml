# Quality-gate configuration for the Garmin sidecar's Python code.
#
# CI and developers run the same command (`bun run check:garmin`), which reads
# this file for ruff, mypy and pytest. `target-version` and `python_version`
# follow the `python:3.12-slim` image the sidecar is deployed in.

[tool.pytest.ini_options]
# Only these modules, so the virtualenv is never walked. Each test module
# follows the runtime module it covers, and `test_contract.py` pins the
# sidecar's wire JSON to the committed fixtures in `contract/`.
testpaths = [
    "test_auth.py",
    "test_activities.py",
    "test_body.py",
    "test_daily.py",
    "test_errors.py",
    "test_values.py",
    "test_contract.py",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = [
    "app.py",
    "auth.py",
    "activities.py",
    "body.py",
    "daily.py",
    "errors.py",
    "values.py",
    "support.py",
    "contract_fixtures.py",
    "test_auth.py",
    "test_activities.py",
    "test_body.py",
    "test_daily.py",
    "test_errors.py",
    "test_values.py",
    "test_contract.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
