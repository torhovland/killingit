# Quality-gate configuration for the Garmin sidecar's Python code.
#
# CI and developers run the same command (`bun run check:garmin`), which reads
# this file for ruff, mypy and pytest. `target-version` and `python_version`
# follow the `python:3.12-slim` image the sidecar is deployed in.

[tool.pytest.ini_options]
testpaths = ["test_app.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app.py", "test_app.py"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
