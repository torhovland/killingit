services:
  db:
    image: postgres:16-alpine
    container_name: killingit-db
    environment:
      POSTGRES_USER: killingit
      POSTGRES_PASSWORD: killingit
      POSTGRES_DB: killingit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U killingit -d killingit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data: