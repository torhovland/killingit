name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    # Only deploy after CI on main; PR CI runs otherwise redeploy test on every
    # push to a pull request branch.
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  # A `workflow_run` deploy reports the default branch's newest commit in
  # `github.sha`, not the commit the triggering CI run verified. `head_sha` is
  # that commit; a manual dispatch has no `workflow_run` payload and deploys the
  # commit it was dispatched for. Every checkout, image tag and release below
  # uses this one value, so they cannot drift apart.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# A deploy is serialised with every other deploy to the same environment (see
# each deploy job's `concurrency`): a running deploy finishes, and a queued one
# waits instead of cancelling it, so two migrations never run at once.
jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # A `workflow_run` deploy is already gated on the triggering CI run's
      # conclusion. A dispatch can select any branch and commit, so it must not
      # deploy a commit that CI has not passed on main.
      - name: Require a successful CI run on main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::A manual deploy must run from main, not ${GITHUB_REF}."
            exit 1
          fi
          verified="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&branch=main&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "${verified}" -lt 1 ]]; then
            echo "::error::No successful CI run for ${DEPLOY_SHA}; refusing to deploy."
            exit 1
          fi
          echo "CI verified ${DEPLOY_SHA}."

  build-and-push-api:
    needs: [verify-ci]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: meta
        run: |
          echo "image=${{ vars.ARTIFACT_REGISTRY }}/killingit-api:${{ env.DEPLOY_SHA }}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "$(echo "${{ vars.ARTIFACT_REGISTRY }}" | cut -d/ -f1)" --quiet

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=killingit-api
            SENTRY_RELEASE=${{ env.DEPLOY_SHA }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  build-and-push-garmin:
    needs: [verify-ci]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: meta
        run: |
          echo "image=${{ vars.ARTIFACT_REGISTRY }}/killingit-garmin:${{ env.DEPLOY_SHA }}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "$(echo "${{ vars.ARTIFACT_REGISTRY }}" | cut -d/ -f1)" --quiet

      - name: Build and push Garmin sidecar image
        uses: docker/build-push-action@v7
        with:
          context: services/garmin
          file: services/garmin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy-web-test:
    needs: [deploy-api-test]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build web (test)
        run: bun run --filter @killingit/web build
        env:
          VITE_APP_ENV: Test
          VITE_API_URL: ${{ vars.TEST_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.TEST_VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: killingit-web
          SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
      - name: Publish to Cloudflare Pages (test)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name ${{ vars.CF_PAGES_TEST }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-api-test:
    needs: [build-and-push-api, build-and-push-garmin]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run migrations (test)
        run: bun run db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}

      - name: Deploy Garmin sidecar to Cloud Run (test)
        id: garmin
        run: |
          gcloud run deploy killingit-garmin-test \
            --image ${{ needs.build-and-push-garmin.outputs.image }} \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --platform managed \
            --no-allow-unauthenticated \
            --memory 1Gi \
            --concurrency 4 \
            --max-instances 1 \
            --timeout 300 \
            --quiet

          url="$(gcloud run services describe killingit-garmin-test \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --format='value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Allow the API to invoke the Garmin sidecar (test)
        run: |
          # Use the API's configured runtime service account, or the Compute
          # Engine default service account when --service-account is unset.
          api_sa="$(gcloud run services describe killingit-api-test \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --format='value(spec.template.spec.serviceAccountName)')"
          if [[ -z "${api_sa}" ]]; then
            api_sa="${{ vars.GCP_PROJECT_NUMBER }}-compute@developer.gserviceaccount.com"
          fi
          gcloud run services add-iam-policy-binding killingit-garmin-test \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --member="serviceAccount:${api_sa}" \
            --role=roles/run.invoker \
            --quiet

      - name: Deploy API to Cloud Run (test)
        run: |
          gcloud run deploy killingit-api-test \
            --image ${{ needs.build-and-push-api.outputs.image }} \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" \
            --set-env-vars "CORS_ORIGIN=https://killingit-test.hovland.co" \
            --set-env-vars "SENTRY_DSN=${{ secrets.TEST_SENTRY_DSN }}" \
            --set-env-vars "SENTRY_RELEASE=${{ env.DEPLOY_SHA }}" \
            --set-env-vars "AUTH0_ISSUER=${{ vars.AUTH0_ISSUER }}" \
            --set-env-vars "AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}" \
            --set-env-vars "GARMIN_SIDECAR_URL=${{ steps.garmin.outputs.url }}" \
            --set-env-vars "GARMIN_SIDECAR_AUDIENCE=${{ steps.garmin.outputs.url }}" \
            --set-env-vars "GARMIN_CREDENTIALS_KEY=${{ secrets.TEST_GARMIN_CREDENTIALS_KEY }}" \
            --set-env-vars "LLM_CREDENTIALS_KEY=${{ secrets.TEST_LLM_CREDENTIALS_KEY }}"

  deploy-web-production:
    needs: [deploy-api-production]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build web (production)
        run: bun run --filter @killingit/web build
        env:
          VITE_APP_ENV: Production
          VITE_API_URL: ${{ vars.PROD_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.PROD_VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: killingit-web
          SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
      - name: Publish to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name ${{ vars.CF_PAGES_PROD }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-api-production:
    needs: [build-and-push-api, build-and-push-garmin]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run migrations (production)
        run: bun run db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}

      - name: Deploy Garmin sidecar to Cloud Run (production)
        id: garmin
        run: |
          gcloud run deploy killingit-garmin \
            --image ${{ needs.build-and-push-garmin.outputs.image }} \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --platform managed \
            --no-allow-unauthenticated \
            --memory 1Gi \
            --concurrency 4 \
            --max-instances 1 \
            --timeout 300 \
            --quiet

          url="$(gcloud run services describe killingit-garmin \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --format='value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Allow the API to invoke the Garmin sidecar (production)
        run: |
          # Use the API's configured runtime service account, or the Compute
          # Engine default service account when --service-account is unset.
          api_sa="$(gcloud run services describe killingit-api \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --format='value(spec.template.spec.serviceAccountName)')"
          if [[ -z "${api_sa}" ]]; then
            api_sa="${{ vars.GCP_PROJECT_NUMBER }}-compute@developer.gserviceaccount.com"
          fi
          gcloud run services add-iam-policy-binding killingit-garmin \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --member="serviceAccount:${api_sa}" \
            --role=roles/run.invoker \
            --quiet

      - name: Deploy API to Cloud Run (production)
        run: |
          gcloud run deploy killingit-api \
            --image ${{ needs.build-and-push-api.outputs.image }} \
            --project ${{ vars.GCP_PROJECT }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --set-env-vars "CORS_ORIGIN=https://killingit.hovland.co" \
            --set-env-vars "SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}" \
            --set-env-vars "SENTRY_RELEASE=${{ env.DEPLOY_SHA }}" \
            --set-env-vars "AUTH0_ISSUER=${{ vars.AUTH0_ISSUER }}" \
            --set-env-vars "AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}" \
            --set-env-vars "GARMIN_SIDECAR_URL=${{ steps.garmin.outputs.url }}" \
            --set-env-vars "GARMIN_SIDECAR_AUDIENCE=${{ steps.garmin.outputs.url }}" \
            --set-env-vars "GARMIN_CREDENTIALS_KEY=${{ secrets.PROD_GARMIN_CREDENTIALS_KEY }}" \
            --set-env-vars "LLM_CREDENTIALS_KEY=${{ secrets.PROD_LLM_CREDENTIALS_KEY }}"
