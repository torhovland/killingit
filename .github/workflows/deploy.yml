name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    # Only deploy after CI on main; PR CI runs otherwise redeploy test on every
    # push to a pull request branch.
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  # A `workflow_run` deploy reports the default branch's newest commit in
  # `github.sha`, not the commit the triggering CI run verified. `head_sha` is
  # that commit; a manual dispatch has no `workflow_run` payload and deploys the
  # commit it was dispatched for. Every checkout, image tag and release below
  # uses this one value, so they cannot drift apart.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# A deploy is serialised with every other deploy to the same environment (see
# each deploy job's `concurrency`): a running deploy finishes, and a queued one
# waits instead of cancelling it, so two migrations never run at once.
jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # A `workflow_run` deploy is already gated on the triggering CI run's
      # conclusion. A dispatch can select any branch and commit, so it must not
      # deploy a commit that CI has not passed on main.
      - name: Require a successful CI run on main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::A manual deploy must run from main, not ${GITHUB_REF}."
            exit 1
          fi
          verified="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&branch=main&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "${verified}" -lt 1 ]]; then
            echo "::error::No successful CI run for ${DEPLOY_SHA}; refusing to deploy."
            exit 1
          fi
          echo "CI verified ${DEPLOY_SHA}."

  build-and-push-api:
    needs: [verify-ci]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: meta
        run: |
          echo "image=${{ vars.ARTIFACT_REGISTRY }}/killingit-api:${{ env.DEPLOY_SHA }}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "$(echo "${{ vars.ARTIFACT_REGISTRY }}" | cut -d/ -f1)" --quiet

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=killingit-api
            SENTRY_RELEASE=${{ env.DEPLOY_SHA }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  build-and-push-garmin:
    needs: [verify-ci]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: meta
        run: |
          echo "image=${{ vars.ARTIFACT_REGISTRY }}/killingit-garmin:${{ env.DEPLOY_SHA }}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "$(echo "${{ vars.ARTIFACT_REGISTRY }}" | cut -d/ -f1)" --quiet

      - name: Build and push Garmin sidecar image
        uses: docker/build-push-action@v7
        with:
          context: services/garmin
          file: services/garmin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  # One reusable workflow holds the API-then-web pipeline both environments
  # run. A caller job cannot use `environment:` beside `uses`, so each caller
  # passes `environment_name` and the called job applies it (the production
  # input selects the approval gate). The caller keeps the CI gate, needs and
  # per-environment concurrency.
  deploy-test:
    needs: [build-and-push-api, build-and-push-garmin]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
      deployments: write
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    with:
      environment_name: test
      deploy_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      api_image: ${{ needs.build-and-push-api.outputs.image }}
      garmin_image: ${{ needs.build-and-push-garmin.outputs.image }}
      api_service: killingit-api-test
      garmin_service: killingit-garmin-test
      cors_origin: https://killingit-test.hovland.co
      vite_app_env: Test
      api_url: ${{ vars.TEST_API_URL }}
      cloudflare_project: ${{ vars.CF_PAGES_TEST }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
      SENTRY_DSN: ${{ secrets.TEST_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.TEST_VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      ADMIN_AUTH_SUBJECT: ${{ secrets.TEST_ADMIN_AUTH_SUBJECT }}
      GARMIN_CREDENTIALS_KEY: ${{ secrets.TEST_GARMIN_CREDENTIALS_KEY }}
      LLM_CREDENTIALS_KEY: ${{ secrets.TEST_LLM_CREDENTIALS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: [build-and-push-api, build-and-push-garmin]
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
      deployments: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    with:
      environment_name: production
      deploy_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      api_image: ${{ needs.build-and-push-api.outputs.image }}
      garmin_image: ${{ needs.build-and-push-garmin.outputs.image }}
      api_service: killingit-api
      garmin_service: killingit-garmin
      cors_origin: https://killingit.hovland.co
      vite_app_env: Production
      api_url: ${{ vars.PROD_API_URL }}
      cloudflare_project: ${{ vars.CF_PAGES_PROD }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
      SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.PROD_VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      ADMIN_AUTH_SUBJECT: ${{ secrets.PROD_ADMIN_AUTH_SUBJECT }}
      GARMIN_CREDENTIALS_KEY: ${{ secrets.PROD_GARMIN_CREDENTIALS_KEY }}
      LLM_CREDENTIALS_KEY: ${{ secrets.PROD_LLM_CREDENTIALS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
