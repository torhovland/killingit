name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # Coverage line counts change between Bun releases. Keep the
          # baseline in scripts/coverage.ts tied to this version.
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: killingit
          POSTGRES_PASSWORD: killingit
          POSTGRES_DB: killingit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U killingit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_DATABASE_URL: postgres://killingit:killingit@localhost:5432/killingit_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # The official Playwright image ships Chromium and every system library it
    # needs, so CI never installs packages from the Ubuntu archives. Keep the
    # tag in step with the @playwright/test version in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: killingit
          POSTGRES_PASSWORD: killingit
          POSTGRES_DB: killingit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U killingit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # A job container reaches service containers by their service label.
      E2E_DATABASE_URL: postgres://killingit:killingit@postgres:5432/killingit_e2e_test
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        # setup-bun needs unzip, which the Playwright image omits. The image
        # has Python, so extract the pinned Bun release without apt.
        run: |
          curl -fsSL -o /tmp/bun.zip \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          python3 -m zipfile -e /tmp/bun.zip /tmp/bun
          install /tmp/bun/bun-linux-x64/bun /usr/local/bin/bun
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  signoff:
    name: Sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: git fetch --no-tags origin ${{ github.base_ref }}
      - run: bun run check:signoff origin/${{ github.base_ref }}

  outdated:
    name: Dependencies up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run outdated
