name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the upload with a short-lived GitHub OIDC token,
      # so no repository secret is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: killingit
          POSTGRES_PASSWORD: killingit
          POSTGRES_DB: killingit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U killingit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_DATABASE_URL: postgres://killingit:killingit@localhost:5432/killingit_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: killingit
          POSTGRES_PASSWORD: killingit
          POSTGRES_DB: killingit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U killingit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://killingit:killingit@localhost:5432/killingit_e2e_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  signoff:
    name: Sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: git fetch --no-tags origin ${{ github.base_ref }}
      - run: bun run check:signoff origin/${{ github.base_ref }}

  outdated:
    name: Dependencies up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run outdated
