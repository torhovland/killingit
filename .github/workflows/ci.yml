name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-install
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-install
      - run: bun run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-install
      - run: bun run format

  unused:
    name: Unused exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-install
      - run: bun run check:unused

  # Proves the artifacts the deploy builds, without publishing them. The deploy
  # builds both images for linux/amd64 on this same runner, so no qemu is
  # needed. Nothing is pushed and no registry is logged in to, and the Sentry
  # build args and token stay unset so the API Dockerfile skips the upload.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-install
      # The root script runs each workspace's own build, so the web app's
      # `vite build` runs here and not just its typecheck.
      - name: Build every workspace
        run: bun run build
      # Fails on a Dockerfile that no longer installs from the lockfile, or on
      # an API bundle whose sources the image does not copy.
      - name: Build the API image
        run: docker build --file apps/api/Dockerfile --tag killingit-api:ci .
      - name: Build the Garmin sidecar image
        run: docker build --file services/garmin/Dockerfile --tag killingit-garmin:ci services/garmin
      # The Dockerfile lists the runtime modules by name, so a module `app.py`
      # imports but the list forgets builds green and fails on first request.
      # Importing the app once proves every module resolves inside the image;
      # starting the server stays the Cloud Run revision's job.
      - name: Import the Garmin sidecar image
        run: docker run --rm killingit-garmin:ci python -c "import app"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Coverage line counts change between Bun releases. Keep the baseline in
      # scripts/coverage.ts tied to .bun-version, which the shared action reads.
      - uses: ./.github/actions/setup-bun-install
      - run: bun run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  garmin:
    name: Garmin sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          # Match the python:3.12-slim image in services/garmin/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/garmin/requirements*.txt
      # The same script a developer runs as `bun run check:garmin`, so the
      # local and CI gates cannot drift apart.
      - run: scripts/check-garmin.sh

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: killingit
          POSTGRES_PASSWORD: killingit
          POSTGRES_DB: killingit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U killingit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_DATABASE_URL: postgres://killingit:killingit@localhost:5432/killingit_test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-install
      - run: bun run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # The official Playwright image ships Chromium and every system library it
    # needs, so CI never installs packages from the Ubuntu archives. Keep the
    # tag in step with the @playwright/test version in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: killingit
          POSTGRES_PASSWORD: killingit
          POSTGRES_DB: killingit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U killingit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # A job container reaches service containers by their service label.
      # sslmode=disable keeps the local service from being treated as a hosted
      # database that needs TLS.
      E2E_DATABASE_URL: postgres://killingit:killingit@postgres:5432/killingit_e2e_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        # setup-bun needs unzip, which the Playwright image omits. The image
        # has Python, so extract the pinned Bun release without apt. The
        # version comes from `.bun-version`, the same file setup-bun reads.
        run: |
          BUN_VERSION="$(cat .bun-version)"
          curl -fsSL -o /tmp/bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          python3 -m zipfile -e /tmp/bun.zip /tmp/bun
          install /tmp/bun/bun-linux-x64/bun /usr/local/bin/bun
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  signoff:
    name: Sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: git fetch --no-tags origin ${{ github.base_ref }}
      - run: bun run check:signoff origin/${{ github.base_ref }}

  outdated:
    name: Dependencies up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-install
      - run: bun run outdated
