<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2c86" />
    <title>Killing It — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #1b2c86;
        --foreground: #f5f7ff;
        --muted: #b3bdf2;
        --lime: #e4ff4f;
        --navy: #14216a;
        --card: #24389e;
        --border: #3a51be;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        background-color: var(--background);
        background-image: radial-gradient(
          ellipse at 50% -10%,
          #2b44b8 0%,
          transparent 60%
        );
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 28rem);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--card);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .brand img {
        width: 2rem;
        height: 2rem;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        margin-top: 0.5rem;
        padding: 0.6rem 1rem;
        border-radius: 0.375rem;
        background: var(--lime);
        color: var(--navy);
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/logo.svg" alt="" width="32" height="32" />
        <span>Killing It</span>
      </div>
      <h1>You're offline</h1>
      <p>
        The app could not reach the network. Reconnect and reload to continue
        with your training. The last loaded app is still available when you go
        back.
      </p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
